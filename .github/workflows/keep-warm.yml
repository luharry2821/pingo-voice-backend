# Render's free plan puts the service to sleep after 15 minutes without traffic,
# and the first request after that waits about a minute while it boots.
# Pinging /health every 10 minutes keeps it awake (about 720 h a month, under the
# free plan's 750 h). GitHub runs scheduled jobs on a best-effort basis, so the
# Pingo page also pings /health as soon as it loads and shows a "waking up" screen.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -fsS --max-time 90 https://pingo-voice-backend.onrender.com/health
