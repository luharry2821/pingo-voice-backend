# Baseline: keyterms off, agent_context off, balanced turn-taking.
# mode and interruption_delay are sent. prompt is sent because it is non-empty.
# Turn-taking is tuned for learners, who pause mid-phrase while thinking:
# min_turn_silence 400 ms (preset 128) so a short pause does not end the turn,
# max_turn_silence 2400 ms (preset 1280) so a long hesitation is not cut off,
# vad_threshold 0.2 (the documented default) sent explicitly so soft or trailing
# speech still counts as speech. All four are editable live from Advanced settings.

target_language: es

stt:
  speech_model: universal-3-6-pro
  language_detection: true
  language_codes: []
  prompt: >-
    A language learner asking how to say words and phrases in another language.
    Speech mixes their own language and the target. The learner may mispronounce
    words or make grammar mistakes.
  keyterms_prompt: []
  agent_context: ""
  agent_context_enabled: false
  mode: balanced
  min_turn_silence: 400
  max_turn_silence: 2400
  # 250 ms (preset 500) so Pingo stops sooner when the learner talks over it.
  interruption_delay: 250
  vad_threshold: 0.2
  # AssemblyAI Voice Focus: near-field | far-field | off. far-field fits laptop mics.
  voice_focus: far-field
  # 0..1, higher suppresses more. null = server default (0.5), not sent.
  voice_focus_threshold: null
  # Mask profane words (first letter kept) in partial and final turns.
  filter_profanity: true

llm:
  # Default is gemma-4-31b (response_format). Set PINGO_LLM_MODEL=qwen3.5-4b-32k-fast
  # for the other model this key can call. That one has no response_format.
  model: gemma-4-31b
  temperature: 0.2
  max_tokens: 450
  stream: false
  timeout_s: 30

tts:
  sample_rate: 24000
  encoding: pcm_s16le
  timeout_s: 30
  voices:
    english: aai-kyla
    spanish: bff56a11-dc95-552e-a93a-59f68ca60b64
    french: aai-donatien
    german: aai-magdalena
    italian: aai-giada
    portuguese: aai-nelson

server:
  host: 127.0.0.1
  port: 8000

log:
  path: logs/turns.jsonl
